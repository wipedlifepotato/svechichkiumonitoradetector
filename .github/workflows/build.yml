name: Build Svechichki Monitor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Apple / macOS ---
#          - os: macos-latest
#            artifact_name: svechichki-macos
#            binary_name: svechichkiumonitoradetector

          # --- Linux x64 ---
          - os: ubuntu-latest
            artifact_name: svechichki-linux-x64
            binary_name: svechichkiumonitoradetector

          # --- Windows x64 ---
          - os: windows-latest
            artifact_name: svechichki-windows-x64
            binary_name: svechichkiumonitoradetector.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Desktop (Windows, Linux, macOS)
        if: matrix.is_android != true
        run: |
          if [ "${{ matrix.target }}" != "" ]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary_name }}
            target/release/${{ matrix.binary_name }}
          if-no-files-found: error
